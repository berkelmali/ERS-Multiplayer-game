<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page not found — Egyptian Rat Screw</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <!--
        WHY THIS FILE EXISTS (v3.16.0).

        firebase.json used to rewrite `**` to /index.html. Every wrong URL —
        a typo, a stale link, a crawler probing for /wp-admin — answered
        200 OK with the entire game. To a search engine that is not a game
        page; it is an unlimited supply of duplicates of the same page, which
        is one of the cheapest ways to make a one-page site look worse than it
        is. The rewrite is gone and this is what an unmatched path gets now:
        a real 404, with links back to somewhere real.
    -->
    <style>
        :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --primary:#58a6ff;
                --line:rgba(255,255,255,.08); }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               background:var(--bg); color:var(--fg); text-align:center; padding:24px;
               font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
        .card { max-width:460px; }
        .code { font-size:3.4rem; font-weight:700; color:var(--primary); line-height:1; margin:0 0 8px; }
        h1 { font-size:1.35rem; margin:0 0 12px; }
        p { color:var(--muted); margin:0 0 24px; }
        nav { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 18px;
              border-top:1px solid var(--line); padding-top:18px; }
        a { color:var(--primary); }
        .play { display:inline-block; background:var(--primary); color:#0d1117; font-weight:600;
                text-decoration:none; padding:11px 22px; border-radius:10px; margin-bottom:24px; }
    </style>
</head>
<body>
    <div class="card">
        <p class="code">404</p>
        <h1>That page isn't here</h1>
        <p>The link may be old, or the address may have a typo in it.</p>
        <a class="play" href="/">Play Egyptian Rat Screw</a>
        <nav>
            <a href="/en/rules">Game Rules</a>
            <a href="/en/about">About</a>
            <a href="/en/privacy">Privacy Policy</a>
        </nav>
    </div>
</body>
</html>
